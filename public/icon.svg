<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Classic Games Hub icon: original joystick geometry, monochrome palette. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#373737"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <g fill="#ffffff">
    <circle cx="256" cy="170" r="58"/>
    <rect x="235" y="200" width="42" height="106" rx="21"/>
    <rect x="138" y="300" width="236" height="74" rx="32"/>
  </g>
  <rect x="170" y="325" width="172" height="14" rx="7" fill="#171717" opacity="0.32"/>
</svg>
