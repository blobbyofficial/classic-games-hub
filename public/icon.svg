<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    App icon and favicon. Deliberately the same mark as the in-app logo
    (components/shell/logo.tsx): a joystick on the brand violet-to-pink
    gradient. The previous icon was an unrelated arrangement of dots and a
    cross, so a browser tab and the site header did not look like the same
    product.

    Drawn for 16px first. Three solid shapes, generous gaps, and no feature
    thinner than a few pixels once scaled to a favicon - anything finer turns
    to mush. The glyph sits inside the middle 60% so the maskable PWA icon can
    crop to a circle without clipping it.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a3dff"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <g fill="#ffffff">
    <circle cx="256" cy="170" r="58"/>
    <rect x="235" y="200" width="42" height="106" rx="21"/>
    <rect x="138" y="300" width="236" height="74" rx="32"/>
  </g>
  <rect x="170" y="325" width="172" height="14" rx="7" fill="#7a3dff" opacity="0.32"/>
</svg>
