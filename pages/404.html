  <script>
    (function () {
      const { initFooterYear } = window.ClassicGamesHub;
      const backBtn = document.getElementById('backBtn');
      const goBack = document.getElementById('goBack');
      const backWrap = document.getElementById('backWrap');

      function animateClick(element) {
        element.style.transition = 'transform 160ms cubic-bezier(.2,.9,.3,1)';
        element.style.transform = 'scale(0.96)';
        setTimeout(() => {
          element.style.transform = '';
        }, 160);
      }

      function goHome() {
        try {
          if (window.history && window.history.length > 1) {
            window.history.back();
            setTimeout(() => {
              if (location.pathname.endsWith('/pages/404.html') || location.pathname.endsWith('/404.html')) {
                location.href = '/pages/homepage.html';
              }
            }, 400);
            return;
          }
        } catch (_error) {
          // noop fallback to direct navigation below
        }

        location.href = '/pages/homepage.html';
      }

      function addTilt() {
        const button = backWrap.querySelector('.site-button');
        if (!button || !window.PointerEvent) {
          return;
        }

        let rect = null;
        let raf = 0;

        function updateRect() {
          rect = button.getBoundingClientRect();
        }

        function onPointerMove(event) {
          if (!rect) {
            updateRect();
          }
          const point = ('touches' in event && event.touches[0]) ? event.touches[0] : event;
          const x = point.clientX - rect.left;
          const y = point.clientY - rect.top;
          const px = (x / rect.width - 0.5) * 2;
          const py = (y / rect.height - 0.5) * 2;
          const rx = (-py) * 8;
          const ry = px * 8;
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => {
            button.style.transform = 'perspective(900px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) scale(1.02)';
          });
        }

        function reset() {
          cancelAnimationFrame(raf);
          button.style.transition = 'transform 400ms cubic-bezier(.2,1,.3,1)';
          button.style.transform = 'scale(1)';
        }

        button.addEventListener('pointerenter', () => {
          updateRect();
          button.style.transition = 'transform 220ms cubic-bezier(.2,1,.3,1)';
          button.style.transform = 'scale(1.02)';
          window.addEventListener('pointermove', onPointerMove);
        });
        button.addEventListener('pointerleave', () => {
          window.removeEventListener('pointermove', onPointerMove);
          reset();
        });
        button.addEventListener('touchstart', (event) => {
          updateRect();
          onPointerMove(event);
        }, { passive: true });
        button.addEventListener('touchend', reset);
        window.addEventListener('resize', updateRect);
      }

      backBtn.addEventListener('click', (event) => {
        event.preventDefault();
        animateClick(event.currentTarget);
        goHome();
      });

      goBack.addEventListener('click', (event) => {
        event.preventDefault();
        animateClick(event.currentTarget);
        window.history.back();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          goHome();
        }
        if ((event.key === 'Enter' || event.key === ' ') && document.activeElement === backBtn) {
          event.preventDefault();
          backBtn.click();
        }
      });

      addTilt();
      initFooterYear();
    })();
  </script>
