<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Classic Games Hub — Game Info</title>
  <meta name="description" content="View game details and play classic retro games like Snake, Tetris, Pong, and more. Modern, responsive, interactive, and mobile-first." />
  <link rel="icon" href="../assets/images/Icon.png" type="image/png" />

  <style>
    :root{
      --bg: linear-gradient(135deg,#0f172a,#1e293b);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent1: #7c3aed;
      --accent2: #06b6d4;
      --radius: 16px;
      --gradient-start: rgba(124,58,237,0.35);
      --gradient-end: rgba(6,182,212,0.35);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      min-height:100vh;
      display:flex;flex-direction:column;
      font-family:'Inter','Segoe UI',Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
      padding:2rem;
      text-align:center;
      animation:fadeIn 0.8s ease forwards;
    }

    body::before{
      content:'';
      position:fixed;top:0;left:0;width:100%;height:100%;
      pointer-events:none;
      background:radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.25) 100%);
      mix-blend-mode:overlay;
      animation:gradientVignette 20s ease infinite;
    }

    header{margin-bottom:3rem;opacity:0;animation:slideFadeIn 1s 0.2s cubic-bezier(0.68,-0.55,0.27,1.55) forwards}
    header h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:.5rem;position:relative;display:inline-block}
    header h1::after{
      content:'';
      position:absolute;
      left:0;bottom:-6px;
      width:100%;
      height:3px;
      background:linear-gradient(270deg,var(--accent1),var(--accent2));
      transform:scaleX(0);
      transform-origin:left;
      transition:transform .3s ease;
    }
    header h1:hover::after{transform:scaleX(1);}
    header p{color:var(--muted);font-size:1rem;max-width:720px;margin:0 auto}

    .game-info{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:2rem;
      z-index:1;
      opacity:0;
      animation:slideFadeIn 1s 0.4s cubic-bezier(0.68,-0.55,0.27,1.55) forwards;
    }

    .thumb{
      width:100%;
      max-width:420px;
      aspect-ratio:4/3;
      background-size:cover;
      background-position:center;
      border-radius:var(--radius);
      border:2px solid rgba(255,255,255,0.1);
      transition:transform .5s ease;
    }
    .thumb:hover{transform:scale(1.05) rotateZ(0.5deg);}

    .details{
      max-width:680px;
      width:min(100%, 680px);
      text-align:left;
      opacity:0;
      animation:slideFadeIn 1s 0.7s cubic-bezier(0.68,-0.55,0.27,1.55) forwards;
    }

    .details p{
      font-size:1rem;
      color:var(--muted);
      margin-bottom:.45rem;
      line-height:1.55;
    }
    .details strong{color:var(--text);}
    .tag{
      display:inline-flex;
      align-items:center;
      padding:.2rem .55rem;
      margin:.2rem .35rem .1rem 0;
      border-radius:999px;
      background:rgba(255,255,255,0.08);
      color:var(--text);
      font-size:.82rem;
    }
    .instruction-block{
      margin-top:1rem;
      padding:1rem 1.1rem;
      border-radius:var(--radius);
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
    }
    .instruction-block strong{display:block;margin-bottom:.65rem;color:var(--text);}
    .instruction-block ol{padding-left:1.25rem;color:var(--muted);display:grid;gap:.45rem;}

    .play-btn{
      padding:2.2rem 4.5rem;
      font-size:1.75rem;
      font-weight:800;
      color:#fff;
      border:none;
      border-radius:var(--radius);
      background:linear-gradient(270deg,var(--gradient-start),var(--gradient-end));
      cursor:pointer;
      perspective:1000px;
      transition:transform .3s ease, filter .3s ease, opacity .3s ease;
      background-size:200% 200%;
      animation:gradientShift 6s ease infinite, slideFadeIn 1s 1s cubic-bezier(0.68,-0.55,0.27,1.55) forwards;
    }
    .play-btn:hover{
      transform:scale(1.2) rotateX(5deg) rotateY(3deg);
      opacity:0.95;
    }
    .play-btn:active{
      transform:scale(1.1) rotateX(-3deg) rotateY(-2deg);
    }
    .play-btn:focus{outline:none;}

    .status{
      padding:1rem;
      border-radius:var(--radius);
      background:rgba(0,0,0,0.35);
      color:var(--muted);
      margin-top:1rem;
      display:inline-block;
      animation:fadeIn 1s 1.5s forwards;
    }

    footer{
      margin-top:auto;
      padding-top:3rem;
      text-align:center;
      color:var(--muted);
      font-size:0.9rem;
    }

    @media(max-width:520px){
      body{padding:1.25rem;}
      .thumb{aspect-ratio:auto;width:100%;height:auto;}
      .play-btn{padding:1.8rem 3rem;font-size:1.5rem;}
    }

    @keyframes gradientVignette{0%{background:radial-gradient(circle at center, transparent 60%, rgba(124,58,237,0.15) 100%)}50%{background:radial-gradient(circle at center, transparent 60%, rgba(6,182,212,0.15) 100%)}100%{background:radial-gradient(circle at center, transparent 60%, rgba(124,58,237,0.15) 100%)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideFadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  </style>
</head>
<body>
  <header>
    <h1 id="gameTitle">Loading Game...</h1>
    <p id="gameDescription"></p>
  </header>

  <div class="game-info" id="gameContainer">
    <div class="thumb" id="gameThumb"></div>
    <div class="details" id="gameDetails"></div>
    <button class="play-btn" id="playBtn">Play Game</button>
    <div class="status" id="statusMessage">Loading game information…</div>
  </div>

  <footer>
    &copy; <span id="year">2025</span> Classic Games Hub. All rights reserved.
  </footer>

  <script>
  (async function(){
    const params = new URLSearchParams(window.location.search);
    const gameSlug = params.get('game');

    const titleEl = document.getElementById('gameTitle');
    const descEl = document.getElementById('gameDescription');
    const thumbEl = document.getElementById('gameThumb');
    const detailsEl = document.getElementById('gameDetails');
    const playBtn = document.getElementById('playBtn');
    const statusEl = document.getElementById('statusMessage');

    function escapeHtml(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    function normalizeBoolean(value){return value === true || value === 'true';}

    function normalizeGame(game){
      const instructions = Array.isArray(game.instructions)
        ? game.instructions.filter(Boolean)
        : (game.instructions ? [game.instructions] : []);
      return {
        ...game,
        id: game.id || game.slug || '—',
        genre: game.genre || 'Arcade',
        difficulty: game.difficulty || 'All skill levels',
        players: game.players || '1 player',
        tags: Array.isArray(game.tags) ? game.tags.filter(Boolean) : [],
        releaseStatus: game.releaseStatus || (normalizeBoolean(game.available) ? 'available' : 'coming-soon'),
        featured: normalizeBoolean(game.featured),
        estimatedSessionMinutes: Number.isFinite(Number(game.estimatedSessionMinutes)) ? Number(game.estimatedSessionMinutes) : null,
        instructions: instructions.length ? instructions : [game.controls || 'No instructions available yet.'],
        themeColor: game.themeColor || '#7c3aed',
        highscoreEnabled: normalizeBoolean(game.highscoreEnabled),
        available: normalizeBoolean(game.available)
      };
    }

    function renderDetails(game){
      const facts = [
        ['Game ID', game.id],
        ['Genre', game.genre],
        ['Difficulty', game.difficulty],
        ['Players', game.players],
        ['Release status', game.releaseStatus.replace(/-/g, ' ')],
        ['Estimated session', game.estimatedSessionMinutes ? `${game.estimatedSessionMinutes} minutes` : 'Flexible'],
        ['High scores', game.highscoreEnabled ? 'Enabled' : 'Not enabled'],
        ['Controls', game.controls || '—']
      ];
      const tagsMarkup = game.tags.length
        ? `<p><strong>Tags:</strong> ${game.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join(' ')}</p>`
        : '';
      const instructionsMarkup = `<div class="instruction-block"><strong>How to play:</strong><ol>${game.instructions.map(step => `<li>${escapeHtml(step)}</li>`).join('')}</ol></div>`;
      detailsEl.innerHTML = `${facts.map(([label, value]) => `<p><strong>${escapeHtml(label)}:</strong> ${escapeHtml(value)}</p>`).join('')}${tagsMarkup}${instructionsMarkup}`;
    }

    async function loadGame(){
      if(!gameSlug){statusEl.textContent='No game specified in URL.';playBtn.style.display='none';return;}
      try{
        const res = await fetch('../games/manifest.json',{cache:'no-store'});
        if(!res.ok) throw new Error('Could not load manifest');
        const manifest = await res.json();
        if(!Array.isArray(manifest)) throw new Error('Manifest format incorrect: expected array');
        const game = manifest.map(normalizeGame).find(g=>g.slug===gameSlug&&(g.available || g.featured));
        if(!game){statusEl.textContent='Game not found or currently unavailable.'; playBtn.style.display = 'none'; return; }

        const thumbUrl = game.thumbnail || '../assets/images/snake-thumb.png';
        await preloadImage(thumbUrl);
        stabiliseThumbBox();

        document.documentElement.style.setProperty('--accent1', game.themeColor);
        titleEl.textContent = game.title || gameSlug;
        descEl.textContent = game.description || '';
        thumbEl.style.backgroundImage = `url('${escapeHtml(thumbUrl)}')`;
        thumbEl.style.backgroundSize = 'cover';
        thumbEl.style.backgroundRepeat = 'no-repeat';
        thumbEl.style.backgroundPosition = 'center center';
        thumbEl.style.boxShadow = `0 0 0 1px ${game.themeColor}55, 0 20px 45px ${game.themeColor}22`;

        renderDetails(game);

        const playTarget = game.playUrl ? `../games/${encodeURIComponent(game.slug)}/${encodeURIComponent(game.playUrl)}` : `../games/${encodeURIComponent(game.slug)}/${encodeURIComponent(game.slug)}-game.html`;

        if(game.available){
          enablePlayButton(playBtn, playTarget);
          playBtn.textContent = 'Play Game';
          playBtn.disabled = false;
          statusEl.textContent = 'Ready to play.';
        } else {
          playBtn.style.display = 'none';
          statusEl.textContent = `This title is ${game.releaseStatus.replace(/-/g, ' ')}.`;
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Failed to load game information. Please try again later.';
        playBtn.style.display = 'none';
      }
    }

    function preloadImage(src, timeout = 8000) {
      return new Promise((resolve) => {
        try {
          const img = new Image();
          let settled = false;
          const t = setTimeout(() => {
            if (!settled) {
              settled = true;
              resolve();
            }
          }, timeout);
          img.onload = () => {
            if (!settled) {
              settled = true;
              clearTimeout(t);
              resolve();
            }
          };
          img.onerror = () => {
            if (!settled) {
              settled = true;
              clearTimeout(t);
              resolve();
            }
          };
          img.src = src;
        } catch (e) {
          resolve();
        }
      });
    }

    function stabiliseThumbBox() {
      if ('aspectRatio' in document.documentElement.style || CSS.supports('aspect-ratio: 1 / 1')) {
        return;
      }
      function update() {
        const w = thumbEl.getBoundingClientRect().width;
        const h = Math.round(w * 0.75);
        thumbEl.style.height = h + 'px';
      }
      update();
      window.addEventListener('resize', debounce(update, 120));
      window.addEventListener('orientationchange', debounce(update, 160));
    }

    function debounce(fn, ms=100){
      let id;
      return (...args)=>{ clearTimeout(id); id = setTimeout(()=> fn(...args), ms); };
    }

    function enablePlayButton(btn, href) {
      btn.style.display = '';
      btn.setAttribute('role', 'button');
      btn.setAttribute('aria-label', 'Play ' + (titleEl.textContent || 'game'));
      btn.tabIndex = 0;
      btn.addEventListener('click', ()=> {
        btn.style.transition = 'transform 160ms cubic-bezier(.2,.9,.3,1)';
        btn.style.transform = 'scale(0.98)';
        setTimeout(()=> {
          btn.style.transform = '';
          window.location.href = href;
        }, 160);
      });
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btn.click();
        }
      });

      let rect = null;
      let active = false;
      let rafId = null;
      let lastX = 0;
      let lastY = 0;

      function computeAndApply(clientX, clientY) {
        if (!rect) rect = btn.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        const px = (x / rect.width) - 0.5;
        const py = (y / rect.height) - 0.5;
        const rotateY = px * 12;
        const rotateX = -py * 12;
        btn.style.transform = `perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.06)`;
      }

      function scheduleApply(x, y) {
        lastX = x;
        lastY = y;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(()=> computeAndApply(lastX, lastY));
      }

      function resetTransform() {
        rect = null;
        btn.style.transform = '';
      }

      btn.addEventListener('pointerenter', (e) => { active = true; rect = btn.getBoundingClientRect(); scheduleApply(e.clientX, e.clientY); });
      btn.addEventListener('pointermove', (e) => { if (!active) return; scheduleApply(e.clientX, e.clientY); });
      btn.addEventListener('pointerleave', () => { active = false; resetTransform(); });
      btn.addEventListener('blur', () => { active = false; resetTransform(); });
      btn.addEventListener('touchstart', (e) => {
        const t = e.touches && e.touches[0];
        if (!t) return;
        active = true;
        rect = btn.getBoundingClientRect();
        scheduleApply(t.clientX, t.clientY);
      }, { passive: true });
      btn.addEventListener('touchmove', (e) => {
        const t = e.touches && e.touches[0];
        if (!t || !active) return;
        scheduleApply(t.clientX, t.clientY);
      }, { passive: true });
      btn.addEventListener('touchend', () => { active = false; setTimeout(resetTransform, 120); });
      btn.addEventListener('touchcancel', () => { active = false; resetTransform(); });
    }

    loadGame();
    document.getElementById('year').textContent = new Date().getFullYear();
  })();
  </script>
</body>
</html>
