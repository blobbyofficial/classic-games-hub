<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Classic Games Hub — Game Info</title>
  <meta name="description" content="View game details and play classic retro games like Snake, Tetris, Pong, and more. Modern, responsive, interactive, and mobile-first." />
  <link rel="icon" href="../assets/images/Icon.png" type="image/png" />

  <style>
    :root{
      --bg: linear-gradient(135deg,#0f172a,#1e293b);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent1: #7c3aed;
      --accent2: #06b6d4;
      --radius: 16px;
      --gradient-start: rgba(124,58,237,0.35);
      --gradient-end: rgba(6,182,212,0.35);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      min-height:100vh;
      display:flex;flex-direction:column;
      font-family:'Inter','Segoe UI',Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
      padding:2rem;
      text-align:center;
      animation:fadeIn 0.8s ease forwards;
    }

    body::before{
      content:'';
      position:fixed;top:0;left:0;width:100%;height:100%;
      pointer-events:none;
      background:radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.25) 100%);
      mix-blend-mode:overlay;
      animation:gradientVignette 20s ease infinite;
    }

    header{margin-bottom:3rem;opacity:0;animation:slideFadeIn 1s 0.2s cubic-bezier(0.68,-0.55,0.27,1.55) forwards}
    header h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:.5rem;position:relative;display:inline-block}
    header h1::after{
      content:'';
      position:absolute;
      left:0;bottom:-6px;
      width:100%;
      height:3px;
      background:linear-gradient(270deg,var(--accent1),var(--accent2));
      transform:scaleX(0);
      transform-origin:left;
      transition:transform .3s ease;
    }
    header h1:hover::after{transform:scaleX(1);}
    header p{color:var(--muted);font-size:1rem;max-width:720px;margin:0 auto}

    .game-info{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:2rem;
      z-index:1;
      opacity:0;
      animation:slideFadeIn 1s 0.4s cubic-bezier(0.68,-0.55,0.27,1.55) forwards;
    }

    .thumb{
      width:100%;
      max-width:420px;
      aspect-ratio:4/3;
      background-size:cover;
      background-position:center;
      border-radius:var(--radius);
      border:2px solid rgba(255,255,255,0.1);
      transition:transform .5s ease;
    }
    .thumb:hover{transform:scale(1.05) rotateZ(0.5deg);}

    .details{
      max-width:680px;
      text-align:left;
      opacity:0;
      animation:slideFadeIn 1s 0.7s cubic-bezier(0.68,-0.55,0.27,1.55) forwards;
    }

    .details h2{
      font-size:1.5rem;
      margin-bottom:.5rem;
      color:var(--accent1);
    }

    .details p{
      font-size:1rem;
      color:var(--muted);
      margin-bottom:.25rem;
    }

    .play-btn{
      padding:2.2rem 4.5rem;
      font-size:1.75rem;
      font-weight:800;
      color:#fff;
      border:none;
      border-radius:var(--radius);
      background:linear-gradient(270deg,var(--gradient-start),var(--gradient-end));
      cursor:pointer;
      perspective:1000px;
      transition:transform .3s ease, filter .3s ease, opacity .3s ease;
      background-size:200% 200%;
      animation:gradientShift 6s ease infinite, slideFadeIn 1s 1s cubic-bezier(0.68,-0.55,0.27,1.55) forwards;
    }
    .play-btn:hover{
      transform:scale(1.2) rotateX(5deg) rotateY(3deg);
      opacity:0.95;
    }
    .play-btn:active{
      transform:scale(1.1) rotateX(-3deg) rotateY(-2deg);
    }
    .play-btn:focus{outline:none;}

    .status{
      padding:1rem;
      border-radius:var(--radius);
      background:rgba(0,0,0,0.35);
      color:var(--muted);
      margin-top:3rem;
      display:inline-block;
      animation:fadeIn 1s 1.5s forwards;
    }

    footer{
      margin-top:auto;
      padding-top:3rem;
      text-align:center;
      color:var(--muted);
      font-size:0.9rem;
    }

    @media(max-width:520px){
      .thumb{aspect-ratio:auto;width:100%;height:auto;}
      .play-btn{padding:1.8rem 3rem;font-size:1.5rem;}
    }

    @keyframes gradientVignette{0%{background:radial-gradient(circle at center, transparent 60%, rgba(124,58,237,0.15) 100%)}50%{background:radial-gradient(circle at center, transparent 60%, rgba(6,182,212,0.15) 100%)}100%{background:radial-gradient(circle at center, transparent 60%, rgba(124,58,237,0.15) 100%)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideFadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  </style>
</head>
<body>
  <header>
    <h1 id="gameTitle">Loading Game...</h1>
    <p id="gameDescription"></p>
  </header>

  <div class="game-info" id="gameContainer">
    <div class="thumb" id="gameThumb"></div>
    <div class="details" id="gameDetails"></div>
    <button class="play-btn" id="playBtn">Play Game</button>
    <div class="status" id="statusMessage">Loading game information…</div>
  </div>

  <footer>
    &copy; <span id="year">2025</span> Classic Games Hub. All rights reserved.
  </footer>

  <script>
  (async function(){
    const params = new URLSearchParams(window.location.search);
    const gameSlug = params.get('game');

    const titleEl = document.getElementById('gameTitle');
    const descEl = document.getElementById('gameDescription');
    const thumbEl = document.getElementById('gameThumb');
    const detailsEl = document.getElementById('gameDetails');
    const playBtn = document.getElementById('playBtn');
    const statusEl = document.getElementById('statusMessage');

    function escapeHtml(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

    async function loadGame(){
      if(!gameSlug){statusEl.textContent='No game specified in URL.';playBtn.style.display='none';return;}
      try{
        const res = await fetch('../games/manifest.json',{cache:'no-store'});
        if(!res.ok) throw new Error('Could not load manifest');
        const manifest = await res.json();
        const game = manifest.find(g=>g.slug===gameSlug&&(g.available===true||g.available==='true'));
        if(!game){statusEl.textContent='Game not found or currently unavailable.'; playBtn.style.display = 'none'; return; }

        // --- Preload thumbnail to avoid mobile glitching --- //
        const thumbUrl = game.thumbnail || '../assets/images/snake-thumb.png';
        await preloadImage(thumbUrl);
        // Stabilise the thumbnail box on small screens (avoid flicker when image loads)
        stabiliseThumbBox();

        // Update page content
        titleEl.textContent = game.title || gameSlug;
        descEl.textContent = game.description || '';
        thumbEl.style.backgroundImage = `url('${escapeHtml(thumbUrl)}')`;
        thumbEl.style.backgroundSize = 'cover';
        thumbEl.style.backgroundRepeat = 'no-repeat';
        thumbEl.style.backgroundPosition = 'center center';

        detailsEl.innerHTML = `<p><strong>Controls:</strong> ${escapeHtml(game.controls || '—')}</p>`;

        // Setup play target (fallback if playUrl missing)
        const playTarget = game.playUrl ? `../games/${encodeURIComponent(game.slug)}/${encodeURIComponent(game.playUrl)}` : `../games/${encodeURIComponent(game.slug)}/${encodeURIComponent(game.slug)}-game.html`;

        // Enable and wire the play button with strong UX
        enablePlayButton(playBtn, playTarget);

        // hide status
        statusEl.style.display = 'none';
        return;
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Failed to load game information. Please try again later.';
        playBtn.style.display = 'none';
        return;
      }
    }

    /* ---------- Utilities & Interactions ---------- */

    // Preload image, returns promise
    function preloadImage(src, timeout = 8000) {
      return new Promise((resolve, reject) => {
        try {
          const img = new Image();
          let settled = false;
          const t = setTimeout(() => {
            if (!settled) {
              settled = true;
              // resolve anyway so UI can continue (avoid blocking)
              resolve();
            }
          }, timeout);
          img.onload = () => {
            if (!settled) {
              settled = true;
              clearTimeout(t);
              resolve();
            }
          };
          img.onerror = () => {
            if (!settled) {
              settled = true;
              clearTimeout(t);
              resolve(); // resolve on error to avoid blocking UX
            }
          };
          img.src = src;
        } catch (e) {
          resolve();
        }
      });
    }

    // Stabilise thumbnail box height on small screens to avoid layout jump
    function stabiliseThumbBox() {
      // Use CSS-first approach: if aspect-ratio is supported, rely on it.
      // But for older mobile browsers, set a fixed height equal to 75% of the current width.
      if ('aspectRatio' in document.documentElement.style || CSS.supports('aspect-ratio: 1 / 1')) {
        // nothing extra needed
        return;
      }
      // fallback: compute height
      function update() {
        const w = thumbEl.getBoundingClientRect().width;
        const h = Math.round(w * 0.75); // 4:3 ratio
        thumbEl.style.height = h + 'px';
      }
      update();
      // update on resize/orientation change
      window.addEventListener('resize', debounce(update, 120));
      window.addEventListener('orientationchange', debounce(update, 160));
    }

    // simple debounce
    function debounce(fn, ms=100){
      let id;
      return (...args)=>{ clearTimeout(id); id = setTimeout(()=> fn(...args), ms); };
    }

    // Enable play button with interactions: click, keyboard, pointer/touch tilt
    function enablePlayButton(btn, href) {
      btn.style.display = ''; // ensure visible
      btn.setAttribute('role', 'button');
      btn.setAttribute('aria-label', 'Play ' + (titleEl.textContent || 'game'));
      btn.tabIndex = 0;

      // Navigate on click
      btn.addEventListener('click', ()=> {
        // small press bounce before navigate for polish
        btn.style.transition = 'transform 160ms cubic-bezier(.2,.9,.3,1)';
        btn.style.transform = 'scale(0.98)';
        setTimeout(()=> {
          // return transform and navigate
          btn.style.transform = '';
          window.location.href = href;
        }, 160);
      });

      // Keyboard activation (Space / Enter)
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btn.click();
        }
      });

      // Pointer-based 3D tilt effect (desktop & pointer-capable)
      // We'll use pointer events for unified handling (mouse/touch/stylus).
      let rect = null;
      let active = false;
      let rafId = null;

      // strength of tilt (degrees)
      const TILT_DEG = 10;
      const SCALE_HOVER = 1.12;
      const RESET_TRANSITION = 'transform 450ms cubic-bezier(.22,1,.36,1)';

      function updateRect() { rect = btn.getBoundingClientRect(); }

      function onPointerMove(e){
        if (!rect) updateRect();
        const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
        const clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
        const px = (clientX - rect.left) / rect.width; // 0..1
        const py = (clientY - rect.top) / rect.height; // 0..1
        // normalized -0.5..0.5 then *2 -> -1..1
        const nx = (px - 0.5) * 2;
        const ny = (py - 0.5) * 2;
        const rotateY = nx * TILT_DEG * -1; // invert for natural feel
        const rotateX = ny * TILT_DEG;
        const scale = SCALE_HOVER;

        // throttle via rAF
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(()=> {
          btn.style.transition = 'transform 80ms cubic-bezier(.2,.9,.3,1)';
          btn.style.transform = `perspective(1200px) translateZ(0) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(${scale})`;
        });
      }

      function onPointerEnter(e){
        active = true;
        updateRect();
        // slightly pop in
        btn.style.transition = 'transform 240ms cubic-bezier(.2,1,.3,1)';
        btn.style.transform = `perspective(1200px) translateZ(0) scale(${SCALE_HOVER})`;
        // start listening for move
        window.addEventListener('pointermove', onPointerMove, {passive:true});
        // for touch fallback
        window.addEventListener('touchmove', onPointerMove, {passive:true});
      }

      function onPointerLeave(){
        active = false;
        if (rafId) cancelAnimationFrame(rafId);
        btn.style.transition = RESET_TRANSITION;
        btn.style.transform = 'none';
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('touchmove', onPointerMove);
      }

      // For devices that support pointer events (incl. mouse), use pointerenter/leave
      btn.addEventListener('pointerenter', onPointerEnter, {passive:true});
      btn.addEventListener('pointerleave', onPointerLeave, {passive:true});
      // For older touch-only browsers, support touchstart/touchend
      btn.addEventListener('touchstart', (e)=> {
        updateRect();
        onPointerMove(e);
      }, {passive:true});
      btn.addEventListener('touchend', ()=> onPointerLeave(), {passive:true});

      // Clean up on page hide/unload
      window.addEventListener('blur', onPointerLeave);
      window.addEventListener('resize', debounce(()=> { updateRect(); }, 120));
    }

    // Kick off loader
    await loadGame();

    // update year
    document.getElementById('year').textContent = new Date().getFullYear();
  })();
</script>
