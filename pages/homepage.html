<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Classic Games Hub — Game Library</title>
  <meta name="description" content="Browse and play retro classics like Snake, Tetris, and Pong. Modern, responsive, beautifully animated, and mobile-friendly." />
  <link rel="icon" href="../assets/images/Icon.png" type="image/png" />

  <style>
    :root{
      --bg: linear-gradient(135deg,#0f172a,#1e293b);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --error: #f87171;
      --accent1: #7c3aed;
      --accent2: #06b6d4;
      --radius: 14px;
      --gradient: linear-gradient(270deg,var(--accent1),var(--accent2),#22d3ee,#a855f7);
      --card-bg: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --featured-bg: rgba(250,204,21,0.14);
      --tag-bg: rgba(148,163,184,0.16);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      min-height:100vh;
      display:flex;flex-direction:column;
      font-family:'Inter','Segoe UI',Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
      padding:1.25rem;
      position:relative;
      -webkit-font-smoothing:antialiased;
    }

    body::before{
      content:'';
      position:fixed;top:0;left:0;width:100%;height:100%;
      pointer-events:none;z-index:0;
      background:radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.25) 100%);
      mix-blend-mode:overlay;animation:gradientVignette 22s ease infinite;
    }

    header{text-align:center;margin-bottom:1.25rem;z-index:1}
    header h1{font-size:clamp(1.6rem,4vw,2.6rem);margin-bottom:.4rem}
    header p{color:var(--muted);max-width:680px;margin:0 auto;font-size:0.98rem}

    main{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
      gap:1rem;
      width:100%;
      align-items:start;
      z-index:1;
    }

    .card{
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:12px;
      overflow:hidden;
      cursor:pointer;
      transition:transform .25s ease,opacity .5s ease, border-color .25s ease, box-shadow .25s ease;
      opacity:0;
      transform:translateY(18px);
      will-change:transform, opacity;
      position:relative;
    }
    .card.loaded{opacity:1;transform:none}
    .card:hover{
      transform:translateY(-4px);
      border-color:rgba(255,255,255,0.18);
      box-shadow:0 18px 40px rgba(15,23,42,0.28);
    }
    .card.featured{
      border-color:rgba(250,204,21,0.3);
      box-shadow:0 0 0 1px rgba(250,204,21,0.12);
    }
    .card .thumb{
      width:100%;
      height:0;
      padding-bottom:65%;
      background-size:cover;
      background-position:center;
      transition:transform .3s ease;
      position:relative;
    }
    .card:hover .thumb{transform:scale(1.05)}
    .card .info{padding:12px 14px 14px;text-align:left}
    .eyebrow{
      display:flex;
      align-items:center;
      gap:.5rem;
      margin-bottom:.55rem;
      flex-wrap:wrap;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:.3rem;
      font-size:.72rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.04em;
      padding:.3rem .55rem;
      border-radius:999px;
      background:var(--tag-bg);
      color:#e2e8f0;
    }
    .badge.featured{background:var(--featured-bg);color:#fde68a}
    .info h2{font-size:1rem;margin-bottom:6px}
    .info p{font-size:0.9rem;color:var(--muted);margin:0 0 .75rem}
    .meta{
      display:flex;
      gap:.45rem;
      flex-wrap:wrap;
      margin-bottom:.75rem;
    }
    .meta-item{
      font-size:.78rem;
      color:#dbeafe;
      background:rgba(59,130,246,0.12);
      border-radius:999px;
      padding:.28rem .55rem;
    }
    .tag-list{
      display:flex;
      flex-wrap:wrap;
      gap:.45rem;
    }
    .tag{
      font-size:.78rem;
      color:var(--text);
      background:rgba(255,255,255,0.08);
      border-radius:999px;
      padding:.24rem .55rem;
    }

    .status{
      grid-column:1/-1;
      text-align:center;
      padding:1rem;
      border-radius:var(--radius);
      background:rgba(0,0,0,0.35);
      backdrop-filter:blur(6px);
      animation:fadeIn .4s ease both;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:0.75rem;
    }
    .status.error{color:var(--error)}
    .status.info{color:var(--muted)}
    .retry-btn{
      padding:0.4rem 0.8rem;
      border:none;
      border-radius:var(--radius);
      background:var(--gradient);
      color:#fff;
      font-weight:600;
      cursor:pointer;
      transition:transform .2s ease;
    }
    .retry-btn:hover{transform:scale(1.05)}

    footer{margin-top:1.25rem;text-align:center;color:var(--muted);font-size:0.9rem}

    @media (max-width:520px){main{grid-template-columns:repeat(1,minmax(0,1fr));gap:.9rem}header h1{font-size:1.4rem}}
    @media (min-width:521px) and (max-width:760px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}

    @keyframes gradientVignette{0%{background:radial-gradient(circle at center, transparent 60%, rgba(124,58,237,0.15) 100%)}50%{background:radial-gradient(circle at center, transparent 60%, rgba(6,182,212,0.15) 100%)}100%{background:radial-gradient(circle at center, transparent 60%, rgba(124,58,237,0.15) 100%)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <header>
    <h1>Game Library</h1>
    <p>Select from the available classics below. Tap a card to view more details and start playing.</p>
  </header>

  <main id="gameGrid" aria-live="polite" aria-busy="true"></main>

  <footer>
    &copy; <span id="year">2025</span> Classic Games Hub. All rights reserved.
  </footer>

  <script>
  (async function(){
    const grid = document.getElementById('gameGrid');

    function escapeHtml(str){
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function normalizeBoolean(value){
      return value === true || value === 'true';
    }

    function normalizeGame(game){
      const tags = Array.isArray(game.tags) ? game.tags.filter(Boolean) : [];
      return {
        ...game,
        id: game.id || game.slug || '',
        genre: game.genre || 'Arcade',
        difficulty: game.difficulty || 'All skill levels',
        players: game.players || '1 player',
        tags,
        releaseStatus: game.releaseStatus || (normalizeBoolean(game.available) ? 'available' : 'coming-soon'),
        featured: normalizeBoolean(game.featured),
        estimatedSessionMinutes: Number.isFinite(Number(game.estimatedSessionMinutes)) ? Number(game.estimatedSessionMinutes) : null,
        themeColor: game.themeColor || 'var(--accent1)',
        available: normalizeBoolean(game.available)
      };
    }

    function showStatus(message, type='info', showRetry=false){
      grid.innerHTML = `<div class="status ${type}">${escapeHtml(message)}${showRetry ? '<button class="retry-btn">Retry</button>' : ''}</div>`;
      if(showRetry){
        document.querySelector('.retry-btn').addEventListener('click', loadGames);
      }
    }

    function renderCard(game){
      const card = document.createElement('article');
      card.className = `card${game.featured ? ' featured' : ''}`;
      card.style.setProperty('--card-accent', game.themeColor);
      const metaBits = [game.genre, game.difficulty, game.players];
      if(game.estimatedSessionMinutes){
        metaBits.push(`${game.estimatedSessionMinutes} min session`);
      }
      const tagMarkup = game.tags.length ? `<div class="tag-list">${game.tags.slice(0,4).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}</div>` : '';
      card.innerHTML = `
        <div class="thumb" style="background-image:url('${escapeHtml(game.thumbnail)}'); box-shadow: inset 0 -80px 120px rgba(15,23,42,0.15), inset 0 0 0 1px ${escapeHtml(game.themeColor)}33;" role="img" aria-label="${escapeHtml(game.title)}"></div>
        <div class="info">
          <div class="eyebrow">
            ${game.featured ? '<span class="badge featured">Featured</span>' : ''}
            <span class="badge">${escapeHtml(game.releaseStatus.replace(/-/g,' '))}</span>
          </div>
          <h2>${escapeHtml(game.title)}</h2>
          <p>${escapeHtml(game.description)}</p>
          <div class="meta">${metaBits.map(item => `<span class="meta-item">${escapeHtml(item)}</span>`).join('')}</div>
          ${tagMarkup}
        </div>`;
      card.addEventListener('click', ()=>{
        window.location.href = `gamepage.html?game=${encodeURIComponent(game.slug)}`;
      });
      grid.appendChild(card);
      requestAnimationFrame(()=> setTimeout(()=> card.classList.add('loaded'), 30));
    }

    async function loadGames(){
      grid.setAttribute('aria-busy','true');
      showStatus('Loading game library…');
      try{
        const res = await fetch('../games/manifest.json', {cache:'no-store'});
        if(!res.ok) throw new Error('Manifest not found (HTTP ' + res.status + ')');

        let manifest;
        try{
          manifest = await res.json();
        }catch(parseErr){
          throw new Error('Manifest JSON is invalid: ' + parseErr.message);
        }

        if(!Array.isArray(manifest)) throw new Error('Manifest format incorrect: expected array');

        const allGames = manifest.filter(Boolean).map(normalizeGame);
        const featuredGames = allGames.filter(game => game.featured);
        const available = allGames.filter(game => game.available);
        const visibleGames = available.length ? available : featuredGames.length ? featuredGames : allGames;
        if(visibleGames.length === 0){
          showStatus('No games are currently available. Check back later!', 'info');
          return;
        }

        const sortedGames = [...visibleGames].sort((a, b) => Number(b.featured) - Number(a.featured) || a.title.localeCompare(b.title));
        grid.innerHTML = '';
        sortedGames.forEach(game=> renderCard(game));
      }catch(err){
        console.error('Error loading games:', err);
        showStatus('Failed to load game library. ' + err.message, 'error', true);
      }finally{
        grid.setAttribute('aria-busy','false');
      }
    }

    loadGames();
    document.getElementById('year').textContent = new Date().getFullYear();
  })();
  </script>
</body>
</html>
