<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Classic Games Hub — Play Retro Classics</title>
  <meta name="description" content="Play Snake, Tetris, Pong and other timeless classics online. Modern, responsive, beautifully animated, and fun." />
  <link rel="icon" href="assets/images/Icon.png" type="image/png" />

  <style>
    :root{
      --bg: linear-gradient(135deg,#0f172a,#1e293b);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent1: #7c3aed;
      --accent2: #06b6d4;
      --radius: 14px;
      --gradient: linear-gradient(270deg,var(--accent1),var(--accent2),#22d3ee,#a855f7);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-family:'Inter', 'Segoe UI', Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
      text-align:center;
      padding:2rem;
      position:relative;
    }

    /* subtle vignette overlay */
    body::before{
      content:'';
      position:fixed;
      top:0;left:0;width:100%;height:100%;
      pointer-events:none;
      background:radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.35) 100%);
      mix-blend-mode:overlay;
      animation:gradientVignette 15s ease infinite;
    }

    header{
      animation:fadeDown 1s ease forwards;
      display:flex;flex-direction:column;align-items:center;gap:1rem;
    }
    header img{
      width:96px;height:96px;
    }
    h1{
      font-size:clamp(2rem,4.5vw,3.5rem);
      color:var(--text);
      line-height:1.2;
      position:relative;
      cursor:pointer;
    }
    h1::after{
      content:'';
      position:absolute;
      left:0;bottom:-6px;
      width:100%;height:4px;
      background:var(--gradient);
      background-size:300% 300%;
      border-radius:2px;
      transform:scaleX(0);
      transform-origin:right;
      transition:transform .4s ease;
      animation:gradientShift 7s ease infinite;
    }
    h1:hover::after{
      transform:scaleX(1);
      transform-origin:left;
    }

    p{
      color:var(--muted);
      font-size:1.1rem;
      max-width:600px;
      line-height:1.5;
      animation:fadeUp 1s ease .3s both;
    }

    nav{
      margin:2rem 0;display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;
    }
    .btn{
      padding:1.2rem 2.5rem;
      font-size:1.25rem;
      border-radius:var(--radius);
      font-weight:700;
      color:var(--text);text-decoration:none;position:relative;overflow:hidden;
      background:rgba(255,255,255,0.05);
      border:3px solid transparent;
      transition:transform .25s;
      backdrop-filter:blur(10px);
    }
    .btn::before{
      content:'';position:absolute;inset:0;border-radius:var(--radius);
      padding:3px;background:var(--gradient);background-size:400% 400%;
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;
      animation:gradientShift 6s linear infinite;
    }
    .btn span{position:relative;z-index:1}
    .btn:hover{transform:translateY(-3px) scale(1.03)}

    footer{
      margin-top:auto;color:var(--muted);font-size:.9rem;
      animation:fadeUp 1s ease .5s both;
    }

    /* animations */
    @keyframes gradientShift{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }
    @keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes gradientVignette{
      0%{background:radial-gradient(circle at center, transparent 60%, rgba(124,58,237,0.25) 100%)}
      50%{background:radial-gradient(circle at center, transparent 60%, rgba(6,182,212,0.25) 100%)}
      100%{background:radial-gradient(circle at center, transparent 60%, rgba(124,58,237,0.25) 100%)}
    }

    @media(max-width:600px){
      nav{flex-direction:column}
      .btn{width:100%;text-align:center}
    }
  </style>
</head>
<body>
  <header>
    <img src="assets/images/Icon.png" alt="Classic Games Hub Logo" />
    <h1>Welcome to Classic Games Hub</h1>
    <p>Play and explore timeless classics with a modern, polished experience. Beautiful animations, responsive design, and smooth interactions make it a joy to play.</p>
  </header>

  <nav>
    <a class="btn" href="pages/homepage.html"><span>Enter Game Hub</span></a>
  </nav>

  <footer>
    &copy; <span id="year">2025</span> Classic Games Hub. All rights reserved.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
