name: Disposable local Supabase migration acceptance
on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'database/tests/**'
      - 'scripts/prepare-local-supabase-migrations.cjs'
      - '.github/workflows/local-supabase-acceptance.yml'
  workflow_dispatch:
jobs:
  migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Initialize LOCAL-only Supabase project
        run: npx --yes supabase@latest init
      - name: Copy complete numbered SQL chain into disposable workspace
        run: node scripts/prepare-local-supabase-migrations.cjs
      - name: Start LOCAL Docker Supabase and apply all migrations
        run: npx --yes supabase@latest start
      - name: Verify migrated RLS and RPC privileges using LOCAL PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f database/tests/001_security_contracts.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f database/tests/phase3_role_contracts.sql
      - name: Local-only diagnostics on failure
        if: failure()
        run: docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@latest stop --no-backup || true
