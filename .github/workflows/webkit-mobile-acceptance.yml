name: Safari-engine mobile acceptance
on:
  pull_request:
    paths:
      - 'features/**'
      - 'components/**'
      - 'styles/**'
      - 'scripts/test-mobile-browser.cjs'
      - '.github/workflows/webkit-mobile-acceptance.yml'
  workflow_dispatch:
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps webkit
      - name: Build preview application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://isgqukmmhuzhpalbruwt.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_K6DD29odFaDeNTYozEsifQ_rD1ThsG5' }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - name: Start preview and test WebKit phone layouts
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/next-webkit.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          BASE_URL=http://127.0.0.1:3000 BROWSER_NAME=webkit node --test scripts/test-mobile-browser.cjs
      - name: Print application diagnostics
        if: failure()
        run: tail -n 120 /tmp/next-webkit.log || true
