name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published rule finds old code rather than waiting for
    # someone to touch the file it applies to.
    - cron: "0 4 * * 1"

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended adds the lower-severity rules; on a site handling
          # user content, sessions and a credits economy the extra noise is
          # worth the coverage.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
