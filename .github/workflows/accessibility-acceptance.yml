name: Accessibility acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'features/**'
      - 'scripts/test-accessibility-browser.cjs'
      - '.github/workflows/accessibility-acceptance.yml'
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright axe-core
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://isgqukmmhuzhpalbruwt.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_K6DD29odFaDeNTYozEsifQ_rD1ThsG5' }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - name: Public mobile and desktop accessibility checks
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/next-a11y.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          BASE_URL=http://127.0.0.1:3000 node --test scripts/test-accessibility-browser.cjs
      - name: Server logs on failure
        if: failure()
        run: tail -n 120 /tmp/next-a11y.log || true
