name: Halloween visual integration checks

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "features/**"
      - "lib/seasonal-theme.ts"
      - "public/seasons/halloween/**"
      - "styles/seasons/**"
      - "scripts/check-halloween.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/halloween-check.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check Halloween integration
        run: npm run check:halloween
      - name: TypeScript validation
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Game engine lifecycle regression
        run: node scripts/test-game-loop.cjs
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://isgqukmmhuzhpalbruwt.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_K6DD29odFaDeNTYozEsifQ_rD1ThsG5' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://classic-games-hub.blobbyofficial.com' }}
