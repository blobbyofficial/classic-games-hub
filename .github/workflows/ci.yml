name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Game loop lifecycle test
        run: node scripts/test-game-loop.cjs

      - name: Regression contract tests
        run: |
          node --test scripts/test-local-supabase-preparation.cjs
          node --test scripts/test-staging-safety.cjs
          node --test scripts/test-game-sound.cjs
          node --test scripts/test-migration-versions.cjs
          node --test scripts/test-render-quality.cjs
          node --test scripts/test-privacy-buckets.cjs
          node --test scripts/test-game-accessibility.cjs
          node --test scripts/test-platform-contracts.cjs
          node --test scripts/test-action-boundaries.cjs
          node --test scripts/test-economy-concurrency.cjs

      - name: Build
        run: npm run build
        env:
          # Publishable values - safe in CI. RLS governs all access.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://isgqukmmhuzhpalbruwt.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_K6DD29odFaDeNTYozEsifQ_rD1ThsG5' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://classic-games-hub.blobbyofficial.com' }}

  bot:
    # Separate package, separate dependencies, separate tsconfig - so a change
    # that only breaks the gateway worker still fails CI rather than being
    # discovered when the worker next restarts.
    name: Discord bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  staging-read-only:
    name: Staging database and two-account acceptance (opt-in)
    if: ${{ vars.V16_STAGING_READ_ONLY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_ISOLATED_CONFIRMED: yes
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_SITE_URL: ${{ secrets.STAGING_SITE_URL }}
      STAGING_PLAYER_A_EMAIL: ${{ secrets.STAGING_PLAYER_A_EMAIL }}
      STAGING_PLAYER_A_PASSWORD: ${{ secrets.STAGING_PLAYER_A_PASSWORD }}
      STAGING_PLAYER_B_EMAIL: ${{ secrets.STAGING_PLAYER_B_EMAIL }}
      STAGING_PLAYER_B_PASSWORD: ${{ secrets.STAGING_PLAYER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Refuse known production database and site endpoints
        run: |
          STAGING_KIND=database STAGING_TARGET_URL="$STAGING_DATABASE_URL" node scripts/assert-isolated-staging.cjs
          STAGING_KIND=website STAGING_TARGET_URL="$STAGING_SITE_URL" node scripts/assert-isolated-staging.cjs
      - run: npm ci
      - name: Check schema RPCs and RLS on disposable staging
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          psql -X -v ON_ERROR_STOP=1 "$STAGING_DATABASE_URL" -f database/tests/001_security_contracts.sql
          psql -X -v ON_ERROR_STOP=1 "$STAGING_DATABASE_URL" -f database/tests/phase3_role_contracts.sql
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Check isolated login and private routes for two synthetic users
        run: node --test scripts/test-staging-accounts.cjs
