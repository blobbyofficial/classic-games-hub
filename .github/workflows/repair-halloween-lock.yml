name: Repair Halloween dependency lockfile
on:
  push:
    branches:
      - feature/halloween-haunted-arcade
    paths:
      - .github/workflows/repair-halloween-lock.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate a fresh lockfile against the normalized manifest
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const p=require("./package.json"),l=require("./package-lock.json");for(const g of ["dependencies","devDependencies"])for(const [name,v] of Object.entries(p[g]||{}))if(l.packages[""][g]?.[name]!==v)throw Error(name+" lock mismatch")'
      - name: Prove reproducible installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile to Halloween branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: regenerate valid dependency lockfile for Halloween release"
            git push origin HEAD:feature/halloween-haunted-arcade
          fi
