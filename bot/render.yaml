# Render blueprint - free plan.
#
# Render's free tier only offers *web services* (they idle out after 15 minutes
# with no inbound traffic), which is why the worker also runs a tiny health
# server: point a free uptime pinger (UptimeRobot, cron-job.org, BetterStack)
# at https://<your-service>.onrender.com/health every 5 minutes and the
# instance stays awake - which is what keeps the bot showing as Online.
#
# Deploy: Render dashboard → New → Blueprint → pick this repo → set the secrets.
services:
  - type: web
    name: classic-games-bot
    runtime: node
    plan: free
    region: frankfurt
    rootDir: bot
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SITE_URL
        value: https://classic-games-hub.blobbyofficial.com
      # Set this to the service's own URL once Render assigns it - the worker
      # then pings itself every 4 minutes as a second line of defence.
      - key: SELF_URL
        sync: false
